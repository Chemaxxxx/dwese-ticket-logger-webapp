<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Cabecera de la página con el título internacionalizado. -->
<head th:replace="fragments/head :: head (#{msg.home.title})"></head>

<body class="d-flex flex-column h-100">

<!-- Header de la aplicación del almacén. -->
<header th:replace="fragments/header-almacen :: header-almacen"></header>

<!-- Contenido principal de la página de inicio. -->
<main class="flex-shrink-0">
  <div class="container">

    <!-- Título principal de la página. -->
    <h1 class="mt-5" th:text="#{msg.home.heading}">Ticket Logger</h1>

    <!-- Descripción de la aplicación. -->
    <p class="lead" th:text="#{msg.home.description}">
      José Manuel - Aplicación Web para el registro de tickets en compras de supermercado
    </p>

  </div>
</main>

<!-- Footer de la aplicación. -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
