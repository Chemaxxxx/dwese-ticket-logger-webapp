
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head (#{msg.region.list.title})"></head>

<body>

<!-- Header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">

    <h1 th:text="#{msg.region.list.heading}">Regions</h1>

    <!-- Mensaje de error -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Tabla de regiones -->
    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <th th:text="#{msg.region.table.id}">ID</th>
            <th th:text="#{msg.region.table.code}">Code</th>
            <th th:text="#{msg.region.table.name}">Name</th>
            <th th:text="#{msg.region.table.actions}">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="region : ${listRegions}">
            <td th:text="${region.id}"></td>
            <td th:text="${region.code}"></td>
            <td th:text="${region.name}"></td>
            <td>
                <!-- Editar región -->
                <a th:href="@{/regions/edit(id=${region.id})}"
                   class="btn btn-primary btn-sm"
                   th:text="#{msg.region.button.edit}">
                    Edit
                </a>

                <!-- Eliminar región -->
                <form th:action="@{/regions/delete}" method="post" class="d-inline">
                    <input type="hidden" name="id" th:value="${region.id}"/>

                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            th:onclick="|return confirm('#{msg.region.delete.confirm}');|"
                            th:text="#{msg.region.button.delete}">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Añadir región -->
    <a th:href="@{/regions/new}"
       class="btn btn-success mt-3"
       th:text="#{msg.region.button.add}">
        Add New Region
    </a>

    <!-- Volver al inicio -->
    <a th:href="@{/}"
       class="btn btn-secondary mt-3"
       th:text="#{msg.region.button.back}">
        Back to Home
    </a>

</main>

<!-- Footer -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
